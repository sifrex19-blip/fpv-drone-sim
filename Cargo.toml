[package]
name = "fpv-drone-sim"
version = "0.6.0"
edition = "2024"
description = "High-performance FPV drone simulator written in Rust"
authors = ["you"]

[dependencies]
bevy = { version = "0.20", default-features = true }
serde = { version = "1", features = ["derive"] }
ron = "0.12"
dirs = "6"
# bevy's built-in gilrs integration handles any gamepad/controller

# Cross-compile support (Windows -> Linux): skip pkg-config probing of
# libwayland at build time; winit loads libwayland at runtime instead.
[target.'cfg(target_os = "linux")'.dependencies]
wayland-sys = { version = "0.31", features = ["dlopen"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
